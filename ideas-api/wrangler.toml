name = "zephino-game-ideas"
workers_dev = true
main = "src/index.mjs"
compatibility_date = "2024-10-01"

# KV namespace "zephino-game-ideas" (daily suggestion limits). Keeping it here
# means Git-triggered deploys don't drop the binding.
[[kv_namespaces]]
binding = "IDEAS_KV"
id = "428917680488477f94f0763b8bce1108"

[vars]
GITHUB_OWNER = "Zephino"
GITHUB_REPO = "Games"

# Set secret (do not commit tokens):
#   npx wrangler secret put GITHUB_TOKEN
