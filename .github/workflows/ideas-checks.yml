name: Game ideas API checks

on:
  push:
    paths:
      - 'ideas-api/**'
      - '.github/workflows/ideas-checks.yml'
  pull_request:
    paths:
      - 'ideas-api/**'
      - '.github/workflows/ideas-checks.yml'
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test game ideas Worker
        working-directory: ideas-api
        run: node --test test/*.test.mjs
